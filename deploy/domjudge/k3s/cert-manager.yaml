# Apply once per default k3s cluster. The bundled Helm controller installs this.
# cert-manager 1.21 supports Kubernetes 1.33 through 1.36; check your node version.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.3
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
