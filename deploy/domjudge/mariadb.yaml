apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: domjudge
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domjudge
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domjudge
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.4.13
          args:
            - --max-connections=100
            - --max-allowed-packet=512M
            - --innodb-snapshot-isolation=OFF
          env:
            - name: MARIADB_DATABASE
              value: domjudge
            - name: MARIADB_USER
              value: domjudge
            - name: MARIADB_ROOT_HOST
              value: "%"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domjudge-database
                  key: DB_ROOT_PASSWORD
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domjudge-database
                  key: DB_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Uses the cluster's default StorageClass. Choose it before first apply.
        resources:
          requests:
            storage: 8Gi
