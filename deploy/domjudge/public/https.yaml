# Optional: publish only after setting private admin and judgehost passwords.
# Requires default k3s Traefik, cert-manager, public DNS, and inbound ports 80/443.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
  namespace: domjudge
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Optionally add: email: your real contact address
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: domjudge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domserver-http
  namespace: domjudge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: domjudge-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: domjudge.rickvm.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domserver
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domserver-https
  namespace: domjudge
  annotations:
    cert-manager.io/issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - domjudge.rickvm.dev
      secretName: domserver-tls
  rules:
    - host: domjudge.rickvm.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domserver
                port:
                  number: 80
